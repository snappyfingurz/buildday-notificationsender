<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Notification Project</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f2f0e9;
            color: #4a4a4a;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background-color: #fbfaf8;
            padding: 3rem 2.5rem;
            border: 1px solid #dcd9d0;
            box-shadow: 6px 6px 0px rgba(210, 205, 195, 0.6); 
            width: 100%;
            max-width: 420px;
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: 2rem;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #2c2825;
            letter-spacing: -0.5px;
        }

        #status {
            margin-bottom: 2rem;
            padding: 12px;
            background-color: #e8e6df;
            border: 1px solid #d6d3cb;
            font-size: 0.9rem;
            color: #5c5552;
            font-family: 'Courier New', Courier, monospace;
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        button:active {
            transform: translateY(2px);
        }

        #enable-btn {
            background-color: #a39081;
            color: #fff;
        }
        #enable-btn:hover {
            background-color: #8f7d6f;
        }

        #send-notification-btn {
            background-color: #7b8572;
            color: #fff;
        }
        #send-notification-btn:hover {
            background-color: #697360;
        }

        button:disabled {
            background-color: #dcd9d0 !important;
            color: #999;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>web dev Notification sender</h1>
        
        <p id="status">Permission Status: Checking...</p>

        <button id="enable-btn">Enable Permissions</button>
        <button id="send-notification-btn" disabled>Send Test Notification</button>
    </div>

    <script>
        const enableBtn = document.getElementById('enable-btn');
        const sendBtn = document.getElementById('send-notification-btn');
        const statusText = document.getElementById('status');

        function updatePermissionStatus() {
            const permission = Notification.permission;
            statusText.textContent = `Permission Status: ${permission}`;
            sendBtn.disabled = (permission !== 'granted');
        }

        enableBtn.addEventListener('click', () => {
            if (!('Notification' in window)) {
                statusText.textContent = 'Permission Status: Browser not supported';
                return;
            }

            Notification.requestPermission().then(permission => {
                updatePermissionStatus();
            });
        });

        sendBtn.addEventListener('click', () => {
            if (Notification.permission === 'granted') {
                new Notification('Alert! New Message!', {
                    body: 'This is the pop-up text you requested.'
                });
            }
        });

        updatePermissionStatus();
    </script>

</body>
</html>
